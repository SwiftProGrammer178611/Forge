<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Mojo</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="pomo.css">
</head>

<body>
    <div class="test">
        <div class="border-b border-default">
            <ul class="flex flex-wrap -mb-px text-sm font-medium text-center text-body">
                <li class="me-2">
                    <a href="/kanban.html"
                        class="inline-flex items-cetner justify-cetner p-4 border-b border-transpatent rounded-t-base hover:text-fg-brand hover:border-brand group">
                        <!-- <svg class="w-4 h-4 me-2 text-bdoy group-hover:text-fg-brand" aria-hidden="true" xmlns="https://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" strok-linejoin="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/> </svg> -->
                        Kanban Board
                    </a>
                </li>
                <li class="me-2">
                    <a href="/pomodoro.html"
                        class="inline-flex items-cetner justify-cetner p-4 border-b border-transpatent rounded-t-base hover:text-fg-brand hover:border-brand group">
                        <!-- <svg class="w-4 h-4 me-2 text-bdoy group-hover:text-fg-brand" aria-hidden="true" xmlns="https://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" strok-linejoin="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/> </svg> -->
                        Pomodoro Timer
                    </a>
                </li>
                <li class="me-2">
                    <a href="/notes.html"
                        class="inline-flex items-cetner justify-cetner p-4 border-b border-transpatent rounded-t-base hover:text-fg-brand hover:border-brand group">
                        <!-- <svg class="w-4 h-4 me-2 text-bdoy group-hover:text-fg-brand" aria-hidden="true" xmlns="https://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" strok-linejoin="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/> </svg> -->
                        Notes
                    </a>
                </li>
                <li class="me-2">
                    <a href="/habits.html"
                        class="inline-flex items-cetner justify-cetner p-4 border-b border-transpatent rounded-t-base hover:text-fg-brand hover:border-brand group">
                        <!-- <svg class="w-4 h-4 me-2 text-bdoy group-hover:text-fg-brand" aria-hidden="true" xmlns="https://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" strok-linejoin="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/> </svg> -->
                        Habits
                    </a>
                </li>
                <li class="me-2">
                    <a href="/vibes.html"
                        class="inline-flex items-cetner justify-cetner p-4 border-b border-transpatent rounded-t-base hover:text-fg-brand hover:border-brand group">
                        <!-- <svg class="w-4 h-4 me-2 text-bdoy group-hover:text-fg-brand" aria-hidden="true" xmlns="https://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24"><path stroke="currentColor" stroke-linecap="round" strok-linejoin="round" stroke-width="2" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Zm0 0a8.949 8.949 0 0 0 4.951-1.488A3.987 3.987 0 0 0 13 16h-2a3.987 3.987 0 0 0-3.951 3.512A8.948 8.948 0 0 0 12 21Zm3-11a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/> </svg> -->
                        Vibes
                    </a>
                </li>
            </ul>
        </div>

        <div id="vista-bg"></div>
        <div id="feh-pomodoro">
            <div id="feh-pomodoro-overlay">
                <img src="spinner.gif"></img>
            </div>
            <span class="btn-icon" id="feh-toggle-settings"><i class="fa fa-cog"></i></span>
            <div id="feh-timer-progress">
                <svg class="circle-timer" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="45" class="circle-background"></circle>
                    <circle cx="50" cy="50" r="45" class="circle-progress"></circle>
                    <text id="feh-timer-time" x="50" y="50" text-anchor="middle" dy=".3em" font-size="18">25:00</text>
                    <text id="feh-timer-pause" x="50" y="50" text-anchor="middle" dy=".3em" font--size="7">Paused</text>
                    <text id="feh-timer-rest" x="50" y="50" text-anchor="middle" dy=".3em" font-size="7">Rest</text>
                </svg>
            </div>
            <div id="feh-timer-sessions">
                <p id="feh-completed-label">Completed work sessions: </p>
                <p id="feh-completed-sessions">0</p>
            </div>
            <div id="feh-timer-functions">
                <div id="feh-timer-settings">
                    <span class="btn-icon" id="feh-close-settings"><i class="fa fa-times"></i></span>
                    <form id="feh-timer-form">
                        <p class="feh-timer-line">
                            <label for="work-duration">Pomodoro</label>
                            <input type="number" id="work-duration" value="25" min="1">
                        </p>
                        <p class="feh-timer-line">
                            <label for="rest-duration">Rest:</label>
                            <input type="number" id="rest-duration" value="5" min="1">
                        </p>
                    </form>
                </div>
                <div id="feh-timer-buttons">
                    <button id="pause-btn"><i class="fa fa-pause"></i></button>
                    <button id="start-btn"><i class="fa fa-play"></i></button>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js" type="module"></script>
</body>

</html>
